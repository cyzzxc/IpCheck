    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(15, 23, 42, 0.12); border-radius: 10px; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #0f172a;
            line-height: 1.5;

            background-image:
                radial-gradient(at 8% 0%,  rgba(56, 189, 248, 0.22) 0%, transparent 42%),
                radial-gradient(at 92% 8%, rgba(167, 139, 250, 0.18) 0%, transparent 40%),

        }

        .container {
            position: relative;
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.60);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 8px 40px rgba(15, 23, 42, 0.06);
            max-width: 1100px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 32px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .header-brand {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(120deg, #0ea5e9 0%, #6366f1 45%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .header-sub {
            font-size: 15px;
            color: #94a3b8;
            font-weight: 400;
        }

        .site-logo { display: none; }

        .ip-quad-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .ip-category-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ip-category-wrapper h3 {
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #64748b;
            padding: 0 4px;
        }

        .ip-grid {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-container {
            padding: 24px 20px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(226, 232, 240, 0.90);
            border-radius: 16px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
            overflow: hidden;
        }

        .card-container::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            border-radius: 0 2px 2px 0;
        }

        #domestic-ipv4 .card-container::before { background: #3b82f6; }
        #global-ipv4 .card-container::before  { background: #8b5cf6; }

        .card-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
            border-color: rgba(148, 163, 184, 0.55);
        }

        .ip-details {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .ip-line-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 4px;
        }

        .ip-address {
            font-size: 1.8em;
            font-weight: 800;
            color: #0f172a;
            word-break: break-all;
            letter-spacing: -0.3px;
        }

        #domestic-ipv4 .ip-address { color: #2563eb; }
        #global-ipv4 .ip-address  { color: #7c3aed; }

        .geo-info {
            font-size: 1.0em;
            color: #94a3b8;
            word-break: break-word;
            line-height: 1.4;
        }

        .loading {
            color: #94a3b8;
            text-align: center;
            padding: 48px 24px;
            font-size: 0.95em;
        }
        .loading a {
            color: #94a3b8;
            font-size: 0.95em;
        }

        .tooltip {
            visibility: hidden;
            width: max-content;
            max-width: 260px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #e2e8f0;
            text-align: left;
            border-radius: 12px;
            padding: 12px 16px;
            position: absolute;
            z-index: 10;
            top: 50%;
            left: calc(100% + 12px);
            opacity: 0;
            transform: translateY(-50%) translateX(4px);
            transition: opacity .20s ease-out, transform .20s ease-out, visibility .20s;
            font-size: 0.8em;
            box-shadow: 0 8px 30px rgba(0,0,0,0.25);
            pointer-events: none;
        }

        .tooltip::after {
            content: "";
            position: absolute;
            right: 100%;
            top: 50%;
            margin-top: -6px;
            border-width: 6px;
            border-style: solid;
            border-color: transparent rgba(15, 23, 42, 0.95) transparent transparent;
        }

        .card-container:hover .tooltip {
            visibility: visible;
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        @media (max-width: 700px) {
            .tooltip {
                left: 50%;
                top: 105%;
                transform: translate(-50%, 8px);
            }
            .tooltip::after {
                right: auto;
                bottom: 100%;
                top: auto;
                left: 50%;
                margin-left: -6px;
                margin-top: 0;
                border-color: transparent transparent rgba(15, 23, 42, 0.95) transparent;
            }
            .card-container:hover .tooltip {
                transform: translate(-50%, 0);
            }
        }

        .tooltip p {
            margin: 6px 0;
            white-space: normal;
            word-break: break-all;
            font-size: 0.95em;
            line-height: 1.5;
        }
        .tooltip strong {
            color: #94a3b8;
            font-weight: 500;
            margin-right: 5px;
        }
        .tooltip span {
            color: #f1f5f9;
        }

        .card-speed-container {
            margin-bottom: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }

        .site-card {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 14px;
            padding: 16px 18px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform .18s ease-out, box-shadow .18s ease-out, border-color .18s ease-out;
            border: 1px solid rgba(226, 232, 240, 0.85);
            cursor: default;
        }
        .site-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
            border-color: rgba(148, 163, 184, 0.50);
        }

        .site-top {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
        }

        .site-icon {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .site-icon img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .site-bottom {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #64748b;
        }

        .face {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: transform .18s ease;
        }
        .face img {
            display: block;
            width: 100%;
            height: 100%;
        }
        .face-well    img { filter: none; }
        .face-common  img { filter: none; }
        .face-timeout img { filter: none; }
        .face-error   img { filter: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .face img[src*="loader-4"] {
            animation: spin 1.2s linear infinite;
        }
        .site-card:hover .face { transform: scale(1.08); }

        .status-text                { transition: color .18s ease; color: #64748b; }
        .status-text-well           { color: #16a34a; font-weight: 600; }
        .status-text-common         { color: #f59e0b; font-weight: 600; }
        .status-text-timeout        { color: #6b7280; font-weight: 600; }
        .status-text-error          { color: #ef4444; font-weight: 600; }

        .site-card .loading {
            padding: 24px 0;
            color: #94a3b8;
        }

        @media (max-width: 640px) {
            body { padding: 12px; }
            .container { padding: 20px 16px; border-radius: 18px; }
            .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .card-container { padding: 20px 16px; }
            .ip-address { font-size: 1.3em; }
            .tooltip { max-width: 220px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-left">
            <div class="header-brand">IPCheck</div>
            <div class="header-sub">国内外 IPv4 分流检测</div>
        </div>
    </div>
    <div class="card-speed-container">
        <div id="sites-grid" class="grid"></div>
    </div>

    <div class="ip-quad-grid">
        <div class="ip-category-wrapper">
            <h3>国内 IPv4</h3>
            <div id="domestic-ipv4" class="ip-grid">
                <div class="card-container">
                    <div class="loading">正在加载...</div>
                </div>
            </div>
        </div>

        <div class="ip-category-wrapper">
            <h3>国际 IPv4</h3>
            <div id="global-ipv4" class="ip-grid">
                <div class="card-container">
                    <div class="loading">正在加载...</div>
                </div>
            </div>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const ipApis = [
        { url: 'https://ipv4.netart.cn/', who: 'domestic' },
        { url: 'https://ipinfo.io/json', who: 'global' },
    ];

    const containers = {
        domestic: document.getElementById('domestic-ipv4'),
        global: document.getElementById('global-ipv4'),
    };
	const iconifyBase = 'https://api.iconify.design';
	const siteIcons = {
		baidu:   `${iconifyBase}/ri/link.svg?color=%231e293b`,
		google:  `${iconifyBase}/ri/google-fill.svg?color=%231e293b`,
		github:  `${iconifyBase}/ri/github-fill.svg?color=%231e293b`,
		youtube: `${iconifyBase}/ri/youtube-fill.svg?color=%23ef4444`,
	};
	const faceIcons = {
		well:    `${iconifyBase}/ri/checkbox-circle-fill.svg?color=%2316a34a`,
		common:  `${iconifyBase}/ri/emotion-normal-line.svg?color=%23f59e0b`,
		timeout: `${iconifyBase}/ri/time-line.svg?color=%236b7280`,
		error:   `${iconifyBase}/ri/close-circle-fill.svg?color=%23ef4444`,
	};

    const sites = [
      { id: 'baidu',   name: 'Baidu',    url: 'https://www.baidu.com/favicon.ico' },
      { id: 'google',  name: 'Google',   url: 'https://www.google.com/favicon.ico' },
      { id: 'github',  name: 'GitHub',   url: 'https://github.com/favicon.ico' },
      { id: 'youtube', name: 'YouTube',  url: 'https://www.youtube.com/favicon.ico' }
    ];

    const TIMEOUT = 6000;
    const gridEl = document.getElementById('sites-grid');
    function clearContainer(container) {
        container.innerHTML = `<div class="card-container"><div class="loading">正在加载...</div></div>`;
    }
    
    function clearLoading(container) {
        const loadingElement = container.querySelector('.card-container');
        if (loadingElement) {
            loadingElement.remove();
        }
    }
    // ponytail: parse both netart (domestic) and ipinfo.io (global) formats
    async function fetchIp(api) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), TIMEOUT);

        try {
            const response = await fetch(api.url, { cache: 'no-store', signal: controller.signal });
            if (!response.ok) throw new Error('Network response was not ok');
            const data = await response.json();
            const ip = data.ip || 'N/A';
            const actualType = ip.includes(':') ? 'v6' : 'v4';
            let country, region, city, area, asn, org;

            if (api.who === 'global') {
                // ipinfo.io format
                country = data.country || 'N/A';
                region = data.region || 'N/A';
                city = data.city || 'N/A';
                area = 'N/A';
                asn = 'N/A';
                org = data.org || 'N/A';
            } else {
                // netart.cn format
                country = (data.country && data.country.name) || 'N/A';
                region = data.subdivision || 'N/A';
                city = data.city || 'N/A';
                area = data.area || 'N/A';
                asn = (data.as && data.as.number) ? String(data.as.number) : 'N/A';
                org = (data.as && (data.as.info || data.as.name)) || 'N/A';
            }

            clearTimeout(timeoutId);
            return { ip, country, region, city, area, asn, org, type: actualType };

        } catch (error) {
            clearTimeout(timeoutId);
            return null;
        }
    }
    function renderIpCard(result, container) {
        const card = document.createElement('div');
        card.className = 'card-container';
        const geoParts = [result.region, result.city, result.area].filter(v => v && v !== 'N/A');
        let geoText = geoParts.join(' ') || 'N/A';
        if (result.country && result.country !== 'N/A' && !result.country.includes('中国') && !result.country.includes('China')) {
            geoText = result.country + ' ' + geoText;
        }
        const isDomestic = container.id === 'domestic-ipv4';
        const ispSuffix = (isDomestic && result.org && result.org !== 'N/A')
            ? ` / ${result.org}`
            : '';

        const tooltipDetails = [
            { label: '国家', value: result.country },
            { label: '省份', value: result.region },
            { label: '城市', value: result.city },
            { label: '区县', value: result.area },
            { label: 'ASN', value: result.asn },
            { label: '归属', value: result.org }
        ].filter(item => item.value && item.value !== 'N/A' && item.value.trim() !== '')
         .map(item => `<p><strong>${item.label}:</strong> <span>${item.value}</span></p>`)
         .join('');

        card.innerHTML = `
            <div class="ip-details">
                <div class="ip-line-wrapper">
                    <div class="ip-address">${result.ip}</div>
                    <div class="geo-info">${geoText}${ispSuffix}</div>
                </div>
            </div>
            <div class="tooltip">
                ${tooltipDetails || '<p>暂无更多详情</p>'}
            </div>
        `;
        container.appendChild(card);
    }


    // ponytail: domestic → netart, global → ipinfo.io
    async function checkip(apis) {
        Object.values(containers).forEach(clearContainer);
        await Promise.allSettled(apis.map(async (api) => {
            const container = containers[api.who];
            try {
                const result = await fetchIp(api);
                if (result) {
                    clearLoading(container);
                    renderIpCard(result, container);
                } else {
                    throw new Error('Failed');
                }
            } catch (e) {
                const label = api.who === 'domestic' ? '国内 IPv4' : '国际 IPv4';
                container.innerHTML = `<div class="card-container"><div class="loading">您可能没有${label} <a href="https://github.com/CyangHH/IpCheck/issues/new" title="该数据有问题?" target="_blank">*反馈</a></div></div>`;
            }
        }));
    }
 	 function speedtest() {
			gridEl.innerHTML = '';
			sites.forEach(site => {
			const card = document.createElement('div');
			card.className = 'site-card';
			card.id = 'card-' + site.id;

			const top = document.createElement('div');
			top.className = 'site-top';
			const icon = document.createElement('span');
			icon.className = 'site-icon';
			const iconImg = document.createElement('img');
			iconImg.src = siteIcons[site.id];
			iconImg.alt = site.name;
			icon.appendChild(iconImg);
			const name = document.createElement('span');
			name.textContent = site.name;
			top.appendChild(icon);
			top.appendChild(name);
			const bottom = document.createElement('div');
			bottom.className = 'site-bottom';
			const face = document.createElement('span');
			face.className = 'face';
			face.id = 'face-' + site.id;
			const faceImg = document.createElement('img');
			faceImg.alt = '';
			face.appendChild(faceImg);
			const text = document.createElement('span');
			text.className = 'status-text';
			text.id = 'status-' + site.id;
			text.textContent = '测试中…';
			const faceImgEl = faceImg;
			faceImgEl.src = `${iconifyBase}/ri/loader-4-fill.svg?color=%2394a3b8`;
			bottom.appendChild(face);
			bottom.appendChild(text);
			card.appendChild(top);
			card.appendChild(bottom);
			gridEl.appendChild(card);
			
			const face_id = document.getElementById('face-' + site.id);
			const text_id = document.getElementById('status-' + site.id);
			const faceImgId = face_id.querySelector('img');
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), TIMEOUT);
            fetch(site.url + '?t=' + new Date().getTime(), { mode: 'no-cors', cache: 'no-store', signal: controller.signal })
                .then(() => {
                    const startTime = performance.now();
                    fetch(site.url + '?t=' + new Date().getTime(), { mode: 'no-cors', cache: 'no-store', signal: controller.signal })
                        .then(() => {
                            const  ms= Math.round(performance.now() - startTime);
							if(ms<=250){
								face_id.className='face face-well';
								text_id.className='status-text-well';
								text_id.textContent = '良好：' + ms + ' ms';
								faceImgId.src = faceIcons.well;}
							else{
								face_id.className='face face-common';
								text_id.className='status-text-common';
								text_id.textContent = '一般：' + ms + ' ms';
								faceImgId.src = faceIcons.common;}
                        });
                })
                .catch(error => {
					if(error.name==='AbortError'){
                    face_id.className='face face-timeout';
					text_id.className='status-text-timeout';
					text_id.textContent = '超时';
					faceImgId.src = faceIcons.timeout;}
					else{
					face_id.className='face face-error';
					text_id.className='status-text-error';
					text_id.textContent = '无法访问';
					faceImgId.src = faceIcons.error;}
                })
                .finally(() => clearTimeout(timeoutId));
        });
    }
	function refreshAll() {
        Promise.all([
            checkip(ipApis),
			speedtest()
            
        ]);
		}
    refreshAll();
});
</script>
